[ronfix]
; 1 = Accord off: the game starts as the original (the fixes are not loaded). For a single start, hold
; Shift while the game starts, or add -original to the game's launch options in Steam.
Off=0

[update]
; 1 = when the game starts, look for a new Accord (signed by Accord) and install it for the next start.
; Set by the setup's "Keep Accord up to date" box. Log: ronfix-update.log.
Enabled=1

[netfix]
; Seconds without a player's turn data before this client reports them lost.
; The drop only happens when EVERY other player has reported them, so everyone in the lobby
; needs this fix for it to help. 0 = off.
WaitReportSeconds=20
; Shorter command delay, offered when YOU host. The game never makes a turn shorter than 400 ms (2 players)
; to 600 ms (8 players), even on a fast connection, so every order waits at least that long. ShortDelay=1 lets
; the lobbies you host use a minimum of TurnFloorMin..TurnFloorMax ms instead (more players = closer to the max).
; It is used only when EVERY player in the lobby has Accord (or RoN-Fix 0.11 to 0.15); otherwise the game's own stays.
; Slow connections still get longer turns (the game uses twice the worst ping). 0 = never offer it.
ShortDelay=0
TurnFloorMin=200
TurnFloorMax=300

[startup]
; Prevents the startup freeze (Steam / PlayFab crypto deadlock). 0 = off.
WarmCrypto=1

[exefix]
; Crash fixes (lobby, recording during shutdown, path at the map edge). 0 = off.
Enabled=1

[telemetry]
; Every N seconds during a match, log the game's own turn timing to ronfix-net.log: command delay and,
; per player, ping / wait / lag / frame time. Read-only (changes nothing in the game). 0 = off.
Interval=10

[lobby]
; Log what happens in multiplayer lobbies to ronfix-net.log (lines LOBBY / PF / LOAD): who joins and
; leaves, ready-box spam, players left behind after a boot, and when each player finishes each loading
; step. Read-only (changes nothing in the game). 0 = off.
Log=1
; Lobby fixes, only when YOU host (nobody else needs Accord for them):
;  - Fixes=1: "Boot Player" really removes the player (no ghost left behind) and he cannot rejoin that lobby;
;    holding Shift while booting also bans him: he is added to ronfix-bans.txt next to the game.
;  - Players in ronfix-bans.txt (PlayFab ids or Steam IDs, one per line, '#' = comment) are removed on joining.
;    To unban: open Accord from the Start menu and press Unban... (or delete the line in that file). Both work
;    within a few seconds, also while the game runs.
;  - SpamKick=N: a player who toggles ready N times within 5 seconds is removed (0 = off).
Fixes=1
BootKick=1
SpamKick=12
; GhostRoom=1: sometimes the game's "Create" gives up, goes back to the Game Browser and leaves your new room
; behind as a ghost ("Host: you, 1/8"), and you cannot host again until you join and leave it. Accord leaves
; that ghost room for you a few seconds later, so you can press Create again. 0 = off.
GhostRoom=1
; Tags=1: your game tells the other players' Accord which Accord release you have (nothing else), and
; ronfix-net.log says for every lobby who has Accord and who plays without it (lines LOBBY tag). Players without
; Accord notice nothing. 0 = off: you announce nothing and nobody is listed.
Tags=1
; TagLines=1: those lines also appear in the lobby's chat on YOUR screen only ("Bravo has Accord 0.16",
; "Charlie plays without Accord", and a summary when the host starts). Nothing is sent to the other players and
; nobody else sees them. 0 = keep them in the log only.
TagLines=1

[steam]
; Steam link (shadow mode): Accord players ping each other over Steam's relay network and log it next to
; PlayFab, to find out whether Steam's path is better, also while the game freezes waiting for a player.
; The game's own traffic is not changed. 0 = off.
Shadow=1
; Mirror=1 (a test, off by default; needs Shadow=1): everything your game sends to the other players also travels
; over Steam to those who have Mirror=1 too, and what arrives is compared with what PlayFab delivered: which path
; was first, by how much, and whether anything was missing (lines MIRROR and WAIT in ronfix-net.log). The game
; still uses PlayFab's messages only, so nothing changes in play. It is the measurement for moving the game's
; traffic between Accord players to Steam. 0 = off.
Mirror=0

[gamefix]
; Set by INSTALL.bat / GAMEPLAY-PACK-OFF.bat. Do not edit by hand.
; Version 0 = gameplay pack off (plays with everybody who has no gameplay pack).
; Version N = gameplay pack N on (plays only with players who have the same pack).
; DataHash = fingerprint of the installed data; if Steam restores the original files the pack
; switches itself off at the next start (and says so).
Version=0
DataHash=
; The gameplay pack PER MATCH instead (set by the pack's INSTALL-SWITCH.bat / SWITCH-OFF.bat). The game starts as
; the original and you can join and host anybody. With Switch=1 and the pack's files staged in ronfix\gameplay1,
; Accord tells each lobby that you have the pack. A match uses the pack's rules only when EVERY player in the
; lobby has it staged too; with anyone else in the lobby the match is the original game. Nothing changes while
; you sit in a lobby: the rules are loaded when the match starts (about 2 seconds more loading when they change).
; ronfix-net.log says what each match used (lines GAMEPLAY). Needs [lobby] Tags=1. Ignored while Version is not 0.
; 0 = off: every match is the original game.
Switch=0
; With Switch=1: 1 = games you play alone (single-player, also saved games and recordings opened from the menu)
; use the pack too. 0 = they use the original game.
Solo=0
